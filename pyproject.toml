[tool.ruff]
line-length = 255
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90", "SLF001", "BLE001", "SIM115", "E402"]
ignore = [
    "E501",   # line too long (handled by line-length setting)
    "E741",   # ambiguous variable name
    "I001",   # import block is un-sorted or un-formatted
    "I002",   # missing-required-import
    "BLE001", # blind exception (intentional broad catch in CLI apps)
    "C901",   # function too complex (pylint equivalent R0912/R0914/R0915)
]

[tool.ruff.lint.isort]
known-first-party = []

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["SLF001"]
